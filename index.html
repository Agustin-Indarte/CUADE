<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Importacion de estilos -->
    <link rel="stylesheet" href="./Styles/0_Navbar/Navbar.css" />
    <link rel="stylesheet" href="./Styles/1_Hero/Hero.css" />
    <link rel="stylesheet" href="./Styles/2_Menu/Menu.css" />
    <link rel="stylesheet" href="./Styles/3_Banner/Banner.css" />
    <link rel="stylesheet" href="./Styles/4_Galery/Galery.css" />
    <link rel="stylesheet" href="./Styles/5_aboutMe/AboutMe.css" />
    <link rel="stylesheet" href="./Styles/6_Contact/Contact.css" />
    <link rel="stylesheet" href="./Styles/7_Footer/Footer.css" />
    <link rel="stylesheet" href="./style.css" />

    <title>Cuade - Cafe</title>
  </head>

  <body>
    <!-- CABECERA CON NAVBAR - Agus -->
    <header class="Navbar">
      <div class="Navbar-Container">
        <a href="#inicio" class="logo"><span class="logo__cafe">C</span>UADE</a>
        <navbar class="Navbar">
          <ul class="Navbar-Container-items">
            <li class="Nav-item"><a href="#Menu">Menu</a></li>
            <li class="Nav-item"><a href="#Galeria">Galeria</a></li>
            <li class="Nav-item"><a href="Nosotros">Nosotros</a></li>
            <li class="Nav-item"><a href="Contacto">Contacto</a></li>
          </ul>
        </navbar>
      </div>
    </header>

    <!-- CUERPO DE PÁGINA CON SECCIONES -->
    <main>
      <!-- 1ra seccion - Hero (Presentacion) - Agus -->
      <section id="Inicio" class="section section-hero">
        <div class="contenedor">
          <!-- contenido de la seccion -->
          <h1>CUADE-CAFE</h1>
        </div>
      </section>

      <!-- 2a seccion - Menu (Servicios) - Agus -->
      <section id="Menu" class="section section-menu">
        <div class="contenedor">
          <!-- contenido de la seccion -->
          <h2>Menu</h2>
        </div>
      </section>

      <!-- 3ra seccion - Banner (Call to Action) - Facundo -->
      <section class="section section-banner">
        <div class="contenedor">
          <!-- contenido de la seccion -->
          <h2>Banner</h2>
        </div>
      </section>

      <!-- 4ta seccion - Galery (Destacados) - Quien quiera-->
      <section id="Galeria" class="section section-galery">
        <div class="contenedor">
          <!-- contenido de la seccion -->
          <h2>Galery</h2>
        </div>
      </section>

      <!-- 5ta seccion - AboutMe (Nosotros) - David -->
      <section id="Nosotros" class="section section-aboutme">
        <div class="contenedor">
          <!-- contenido de la seccion -->
          <h2>AboutMe</h2>
        </div>
      </section>

      <!-- 6ta seccion - Contact (Contacto) - Facundo -->
      <section id="Contacto" class="section section-contact">
        <div class="contenedor">
          <!-- contenido de la seccion -->
          <h2>Contacto</h2>
        </div>
      </section>
    </main>

    <!-- 6ta seccion - Footer (Pie) - Facundo -->
    <footer class="footer">
      <h2>Footer</h2>
    </footer>
  </body>
</html>
